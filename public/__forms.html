<!DOCTYPE html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <title>Netlify Forms</title>
  </head>
  <body>
    <form
      name="contact"
      data-netlify="true"
      data-netlify-honeypot="bot-field"
      hidden
    >
      <input type="hidden" name="form-name" value="contact" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <select name="need">
        <option value="start">Start running ads</option>
        <option value="improve">Fix what I already run</option>
        <option value="alongside">Run alongside my current setup</option>
        <option value="call">Just the call</option>
      </select>
      <textarea name="message"></textarea>
      <input type="text" name="bot-field" />
    </form>
    <form
      name="campaign"
      data-netlify="true"
      data-netlify-honeypot="bot-field"
      hidden
    >
      <input type="hidden" name="form-name" value="campaign" />
      <input type="text" name="website" />
      <input type="email" name="email" />
      <select name="spend">
        <option value="under-5k">Under £5,000</option>
        <option value="5-10k">£5,000 – £10,000</option>
        <option value="10-25k">£10,000 – £25,000</option>
        <option value="25-50k">£25,000 – £50,000</option>
        <option value="50-100k">£50,000 – £100,000</option>
        <option value="over-100k">Over £100,000</option>
      </select>
      <input type="checkbox" name="qualify" />
      <input type="text" name="bot-field" />
    </form>
  </body>
</html>
